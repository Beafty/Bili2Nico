<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; font: 14px/1.5 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f7f8fa; color: #1f2329; width: 320px; padding: 14px 16px; box-sizing: border-box; }
  h1 { font-size: 16px; margin: 0 0 12px; color: #0087b0; }
  .row { margin-bottom: 12px; }
  label { display: block; margin-bottom: 4px; color: #646a73; font-size: 13px; }
  input[type="number"], select { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #e4e6eb; border-radius: 6px; font-size: 14px; }
  .check { display: flex; align-items: center; gap: 6px; }
  .check input { width: auto; }
  .check span { font-size: 13px; color: #646a73; }
  button { width: 100%; margin-top: 6px; padding: 8px; border: none; border-radius: 6px; background: #00a1d6; color: #fff; font-size: 14px; cursor: pointer; }
  button:hover { background: #0087b0; }
  #msg { text-align: center; margin-top: 8px; color: #2e7d32; font-size: 13px; min-height: 16px; }
  .hint { color: #9aa0a6; font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>
  <h1 data-i18n="title">Bili2Nico 设置</h1>

  <div class="row">
    <label for="lang" data-i18n="langLabel">语言 / 言語</label>
    <select id="lang">
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
    </select>
  </div>

  <div class="row">
    <label for="maxComments" data-i18n="maxComments">弹幕总数上限 (MAX_COMMENTS)</label>
    <input type="number" id="maxComments" min="1" max="100000" step="100">
    <div class="hint" data-i18n="maxHint">超过该数量的弹幕会被截取，避免初始化卡死。</div>
  </div>

  <div class="row">
    <label for="commentLimit" data-i18n="commentLimit">单帧绘制上限 (commentLimit)</label>
    <input type="number" id="commentLimit" min="0" max="5000" step="50">
    <div class="hint" data-i18n="limitHint">同屏弹幕超过该数量时优先保留较新的弹幕。</div>
  </div>

  <div class="row">
    <label for="dmSourceMode" data-i18n="sourceMode">弹幕来源优先级</label>
    <select id="dmSourceMode">
      <option value="seg">segment (protobuf) —— 完整历史弹幕</option>
      <option value="xml">XML —— 实时弹幕池（可能截断）</option>
    </select>
  </div>

  <div class="row">
    <label for="font" data-i18n="font">弹幕字体</label>
    <select id="font">
      <option value="defont">默认 (defont)</option>
      <option value="gothic">哥特 (gothic)</option>
      <option value="mincho">明朝 (mincho)</option>
    </select>
  </div>

  <div class="row">
    <label for="commentOpacity" data-i18n="opacity">弹幕不透明度</label>
    <div style="display:flex;align-items:center;gap:8px;">
      <input type="range" id="commentOpacity" min="0" max="100" step="1" style="flex:1;">
      <span id="commentOpacityVal" style="min-width:44px;text-align:right;color:#0087b0;">100%</span>
    </div>
  </div>

  <div class="row">
    <label for="renderMode" data-i18n="renderMode">弹幕渲染格式</label>
    <select id="renderMode">
      <option value="nico">N站（Niconico 风格）</option>
      <option value="bili">B站（原生）</option>
    </select>
  </div>

  <div class="row check">
    <input type="checkbox" id="lazyFull">
    <span data-i18n="lazy">完整弹幕（关闭 lazy 惰性布局，性能略降）</span>
  </div>

  <div class="row check">
    <input type="checkbox" id="debugEnabled">
    <span data-i18n="debug">显示右下角调试日志面板</span>
  </div>

  <button id="save" data-i18n="save">保存设置</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
